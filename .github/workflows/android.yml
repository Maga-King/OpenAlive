name: Android build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: '编译通过后发布当前版本'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare Android and Rust
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865'
          rustup target add aarch64-linux-android
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Load signing key
        env:
          KEY_DATA: ${{ secrets.OPENALIVE_KEYSTORE_B64 }}
        run: |
          python3 - <<'PY'
          import os,base64,pathlib
          if not os.environ.get('KEY_DATA'):raise SystemExit('Missing OPENALIVE_KEYSTORE_B64 secret')
          key=pathlib.Path(os.environ['RUNNER_TEMP'])/'openalive.jks'
          key.write_bytes(base64.b64decode(os.environ['KEY_DATA'],validate=True))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('OPENALIVE_KEYSTORE='+str(key)+'\n')
          PY
      - name: Compile and verify
        env:
          OPENALIVE_STORE_PASSWORD: ${{ secrets.OPENALIVE_STORE_PASSWORD }}
        run: python3 tools/build_release.py
      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OpenAlive-arm64-v8a
          path: dist/
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("dist/build-report.json"))["version"])')
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo 'Tag does not match the APK version'; exit 1
          fi
          gh release create "$tag" dist/*.apk dist/SHA256SUMS dist/build-report.json \
            --target "$GITHUB_SHA" --title "OpenAlive $version" --prerelease --notes-file docs/release-notes.md
      - name: Remove signing key
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'openalive.jks').unlink(missing_ok=True)
          PY
